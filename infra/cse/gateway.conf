user nginx;
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;
events { worker_connections 256; }
http {
    access_log off;
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 3s;
    client_max_body_size 1m;
    client_body_timeout 10s;
    map $ssl_client_s_dn $certificate_originator {
        default "";
        "~^CN=(?<actor_from_certificate>C[A-Za-z0-9_-]*)$" $actor_from_certificate;
    }
    server {
        listen 8443 ssl;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_certificate /run/cse/gateway/certificate.crt;
        ssl_certificate_key /run/cse/gateway/private.key;
        ssl_client_certificate /run/cse/ca.crt;
        ssl_verify_client on;
        ssl_verify_depth 1;
        ssl_session_tickets off;
        if ($certificate_originator = "") { return 403; }
        if ($http_x_m2m_origin != $certificate_originator) { return 403; }
        location / {
            proxy_pass http://secure-cse:8080;
            proxy_set_header X-M2M-Origin $certificate_originator;
            proxy_set_header Host secure-cse:8080;
            proxy_next_upstream off;
            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;
        }
    }
    # Private CSE callback relay. This is explicitly NOT an authenticated/TLS
    # callback binding. Only the CSE/gateway join the backend network.
    server {
        listen 8000;
        location = /onem2m/notify {
            # secure-check starts after this gateway; resolve it only when the
            # CSE sends a callback, avoiding a startup DNS dependency cycle.
            set $callback_backend secure-check:8000;
            proxy_pass http://$callback_backend/onem2m/notify;
            proxy_next_upstream off;
        }
        location / { return 404; }
    }
}

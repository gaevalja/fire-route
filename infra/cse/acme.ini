[basic.config]
cseType=IN
cseID=id-fire-route-dev
cseName=fire-route-dev
adminID=CAdmin
networkInterface=0.0.0.0
cseHost=cse
httpPort=8080
databaseType=tinydb
logLevel=info

[cse]
releaseVersion=4
supportedReleaseVersions=4
enableRemoteCSE=False
enableSubscriptionVerificationRequests=True

[cse.registration]
allowedAEOriginators=C*,S*

[cse.security]
enableACPChecks=True

[http]
enableManagementEndpoint=False
enableStructureEndpoint=False
enableUpperTesterEndpoint=False

[textui]
startWithTUI=False

[console]
# Keep the runtime noninteractive without suppressing pre-config CLI errors.
headless=True

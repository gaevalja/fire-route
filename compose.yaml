name: fire-route
services:
  cse:
    stop_grace_period: 30s
    build:
      context: .
      dockerfile: infra/cse/Dockerfile
    ports:
      - "127.0.0.1:${CSE_HOST_PORT:-8080}:8080"
    volumes:
      - cse-data:/data
      - cse-metadata:/metadata
    healthcheck:
      test: ["CMD", "python", "/opt/fire-route/healthcheck.py"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 10s
  p0:
    profiles: ["smoke"]
    build: &core_build
      context: .
      dockerfile: infra/core.Dockerfile
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    depends_on:
      cse:
        condition: service_healthy
    environment: &core_environment
      CSE_BASE_URL: http://cse:8080
      CSE_BASE_RESOURCE: fire-route-dev
      CSE_RELEASE: "4"
      CSE_ORIGINATOR: CAdmin
      CSE_MODE: real
      MEC_MODE: unavailable
      DEMO_MODE: simulator
      NOTIFICATION_PUBLIC_URL: http://p0:8000/onem2m/notify
      NOTIFICATION_BIND_HOST: 0.0.0.0
      NOTIFICATION_BIND_PORT: "8000"
      CSE_RUNTIME_INFO: /metadata/cse.json
      EVIDENCE_ROOT: /app/evidence
    volumes:
      - ./evidence:/app/evidence
      - cse-metadata:/metadata:ro
  p1-routes:
    profiles: ["routes"]
    build: *core_build
    entrypoint: ["python", "-m", "backend.p1_routes"]
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    depends_on:
      cse:
        condition: service_healthy
    environment:
      <<: *core_environment
      NOTIFICATION_PUBLIC_URL: http://p1-routes:8000/onem2m/notify
    volumes:
      - ./evidence:/app/evidence
      - cse-metadata:/metadata:ro
  p1-group:
    profiles: ["group"]
    build: *core_build
    entrypoint: ["python", "-m", "backend.p1_group"]
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    depends_on:
      cse:
        condition: service_healthy
    environment:
      <<: *core_environment
      NOTIFICATION_PUBLIC_URL: http://p1-group:8000/onem2m/notify
    volumes:
      - ./evidence:/app/evidence
      - cse-metadata:/metadata:ro
  scenario-core:
    profiles: ["scenario"]
    build: *core_build
    entrypoint: ["python", "-m", "backend.scenario_core"]
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    depends_on:
      cse:
        condition: service_healthy
    environment:
      <<: *core_environment
      NOTIFICATION_PUBLIC_URL: http://scenario-core:8000/onem2m/notify
      SCENARIO_TRACE: /run/fire-route/scenario.jsonl
    volumes:
      - ./evidence:/app/evidence
      - cse-metadata:/metadata:ro
      - ./.runtime/fire-evac-trace.jsonl:/run/fire-route/scenario.jsonl:ro
  scenario-app:
    profiles: ["scenario-demo"]
    build: *core_build
    entrypoint: ["python", "-m", "backend.scenario_demo"]
    stop_grace_period: 30s
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    depends_on:
      cse:
        condition: service_healthy
    environment:
      <<: *core_environment
      NOTIFICATION_PUBLIC_URL: http://scenario-app:8000/onem2m/notify
      SCENARIO_TRACE: /run/fire-route/scenario.jsonl
      APP_AUTH_FILE: /run/fire-route/auth.json
      APP_PUBLIC_ORIGIN: http://127.0.0.1:${SCENARIO_HOST_PORT:-3001}
      APP_BIND_HOST: 0.0.0.0
      APP_PORT: "3000"
    ports:
      - "127.0.0.1:${SCENARIO_HOST_PORT:-3001}:3000"
    volumes:
      - ./evidence:/app/evidence
      - cse-metadata:/metadata:ro
      - ./.runtime/auth.json:/run/fire-route/auth.json:ro
      - ./.runtime/fire-evac-trace.jsonl:/run/fire-route/scenario.jsonl:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/healthz', timeout=2).close()"]
      interval: 3s
      timeout: 4s
      retries: 30
  scenario-check:
    profiles: ["scenario-check"]
    build: *core_build
    entrypoint: ["python", "-m", "tests.integration.selected_dashboard_check"]
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    depends_on:
      scenario-app:
        condition: service_healthy
    environment:
      DASHBOARD_URL: http://scenario-app:3000
      APP_PUBLIC_ORIGIN: http://127.0.0.1:${SCENARIO_HOST_PORT:-3001}
      ACCESS_CODES_FILE: /run/fire-route/access-codes.json
      EVIDENCE_ROOT: /app/evidence
    volumes:
      - ./evidence:/app/evidence
      - ./.runtime/access-codes.json:/run/fire-route/access-codes.json:ro
  app:
    profiles: ["dashboard"]
    build: *core_build
    entrypoint: ["python", "-m", "backend.demo"]
    stop_grace_period: 30s
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    depends_on:
      cse:
        condition: service_healthy
    environment:
      <<: *core_environment
      NOTIFICATION_PUBLIC_URL: http://app:8000/onem2m/notify
      APP_AUTH_FILE: /run/fire-route/auth.json
      APP_PUBLIC_ORIGIN: http://127.0.0.1:${APP_HOST_PORT:-3000}
      APP_BIND_HOST: 0.0.0.0
      APP_PORT: "3000"
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-3000}:3000"
    volumes:
      - ./evidence:/app/evidence
      - cse-metadata:/metadata:ro
      - ./.runtime/auth.json:/run/fire-route/auth.json:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/healthz', timeout=2).close()"]
      interval: 3s
      timeout: 4s
      retries: 30
  dashboard-check:
    profiles: ["dashboard-check"]
    build: *core_build
    entrypoint: ["python", "-m", "tests.integration.dashboard_check"]
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    depends_on:
      app:
        condition: service_healthy
    environment:
      DASHBOARD_URL: http://app:3000
      APP_PUBLIC_ORIGIN: http://127.0.0.1:${APP_HOST_PORT:-3000}
      ACCESS_CODES_FILE: /run/fire-route/access-codes.json
      EVIDENCE_ROOT: /app/evidence
    volumes:
      - ./evidence:/app/evidence
      - ./.runtime/access-codes.json:/run/fire-route/access-codes.json:ro
volumes:
  cse-data:
  cse-metadata:

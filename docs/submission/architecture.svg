<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="730" viewBox="0 0 1280 730" role="img" aria-labelledby="title desc">
<title id="title">FireRoute actual local architecture</title><desc id="desc">Synthetic source frames pass through the actual ACME CSE, subscription-driven risk controller, Group fan-out and three independently acknowledging simulated displays. Residents and responders use a separate authenticated API. MEC is unavailable.</desc>
